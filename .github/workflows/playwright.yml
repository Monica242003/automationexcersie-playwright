name: Playwright Cucumber E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright Cucumber Tests
      env:
        CI: 'true'
        DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD || 'Pass1234!' }}
        CARD_NUMBER: ${{ secrets.CARD_NUMBER || '1234567890123456' }}
      run: npm test

    - name: Upload Test Reports & Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-cucumber-reports
        path: |
          reports/
        retention-days: 30
